[project]
name = "video-asset-ai"
version = "0.1.0"
description = "漫剧视频素材处理服务"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
characters = [
    "pillow<13",
    "torch>=2.6,<3",
    "torchvision<1",
    "transformers>=5.5,<6",
]
dialogue = [
    "funasr>=1.4.27",
    "modelscope>=1.40.3",
    "torch>=2.6,<3",
    "torchaudio>=2.6,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
